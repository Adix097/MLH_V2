<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ricky Doorstep Rickshaw App logo</title>
  <desc id="desc">Purple rounded-square app icon with a white rickshaw bicycle illustration and Ricky wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B20E8"/>
      <stop offset="1" stop-color="#7410D0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#D7A5FF"/>
      <stop offset="1" stop-color="#9C45F4"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bg)" stroke="url(#edge)" stroke-width="6"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- stylized rickshaw canopy and driver -->
    <path d="M139 145 L166 122 L231 126 L199 165 L164 165 Z" fill="#fff" stroke="none"/>
    <path d="M166 132 L160 176 L180 151 L196 165 L209 132" stroke="#7C18D8" stroke-width="5"/>
    <path d="M181 166 L176 201 Q176 219 196 232 L231 249" stroke-width="7"/>
    <!-- frame / handlebar -->
    <path d="M228 249 L273 282 L337 282 L382 249" stroke-width="8"/>
    <path d="M273 282 L299 238 L337 282 L321 229" stroke-width="8"/>
    <path d="M321 229 L354 229 Q365 229 370 242 L382 249" stroke-width="8"/>
    <path d="M343 220 L365 220 L374 233" stroke-width="7"/>
    <!-- wheels -->
    <circle cx="145" cy="290" r="38" stroke-width="9"/>
    <circle cx="391" cy="290" r="38" stroke-width="9"/>
    <path d="M145 290 L228 249 L273 282 L299 238 L391 290" stroke-width="7"/>
    <path d="M228 249 L215 220" stroke-width="7"/>
    <path d="M202 218 L226 218" stroke-width="7"/>
  </g>
  <text x="256" y="414" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="400" letter-spacing="-2">RICKY</text>
  <text x="256" y="448" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" letter-spacing="0.2">DOORSTEP RICKSHAW APP</text>
</svg>
